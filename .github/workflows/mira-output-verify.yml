name: MIRA Output Verification

on:
  push:
  pull_request:

jobs:
  verify-output:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi httpx pytest

      - name: Run canonical examples
        run: python3 run_canonical_examples.py

      - name: Run API tests
        run: python3 -m pytest tests/test_api.py -v

      - name: Validate receipt schema
        run: python3 validate_receipt.py

      - name: Verify ledger
        run: python3 verify_ledger.py

      - name: Run LangChain adapter tests
        run: python3 -m pytest tests/test_langchain_adapter.py -v

      - name: Run AutoGen adapter tests
        run: python3 -m pytest tests/test_autogen_adapter.py -v

      - name: Run CrewAI adapter tests
        run: python3 -m pytest tests/test_crewai_adapter.py -v
