name: Veridian Tests

on:
  push:
  pull_request:

jobs:
  verify-output:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi httpx pytest

      - name: Run canonical examples
        run: python run_canonical_examples.py

      - name: Run API tests
        run: python -m pytest tests/test_api.py -v
   
      - name: Validate receipt schema
        run: python validate_receipt.py

      - name: Run LangChain adapter tests
        run: python3 -m pytest tests/test_langchain_adapter.py -v

      - name: Run AutoGen adapter tests
        run: python3 -m pytest tests/test_autogen_adapter.py -v
      - name: Run CrewAI adapter tests
        run: python3 -m pytest tests/test_crewai_adapter.py -v
